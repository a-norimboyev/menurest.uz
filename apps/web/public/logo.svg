<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#126E48"/>
      <stop offset="100%" stop-color="#083B25"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#052E1D" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="124" fill="url(#brandGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="112" fill="none" stroke="#25A26E" stroke-width="7" stroke-opacity="0.3"/>

  <!-- QR Corner Target Brackets -->
  <path d="M 92 144 L 92 92 L 144 92" fill="none" stroke="#34D399" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 420 144 L 420 92 L 368 92" fill="none" stroke="#34D399" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 92 368 L 92 420 L 144 420" fill="none" stroke="#34D399" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 420 368 L 420 420 L 368 420" fill="none" stroke="#34D399" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Dining Cloche & Utensils -->
  <g filter="url(#glow)">
    <!-- Cloche Handle -->
    <circle cx="256" cy="160" r="22" fill="#FFFFFF"/>
    
    <!-- Cloche Dome -->
    <path d="M 144 286 C 144 198 194 182 256 182 C 318 182 368 198 368 286 Z" fill="#FFFFFF"/>
    
    <!-- Serving Platter -->
    <rect x="124" y="296" width="264" height="22" rx="11" fill="#FFFFFF"/>

    <!-- Fork & Knife crossed below platter -->
    <!-- Fork lines (Left) -->
    <path d="M 194 336 L 230 380" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
    <!-- Spoon/Knife lines (Right) -->
    <path d="M 318 336 L 282 380" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>

    <!-- QR Node inside Cloche Dome -->
    <rect x="232" y="222" width="48" height="48" rx="10" fill="#0F5C3C"/>
    <circle cx="256" cy="246" r="11" fill="#34D399"/>
  </g>
</svg>
