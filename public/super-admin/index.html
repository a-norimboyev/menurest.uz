<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin - QR Menyu Platformasi</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/super-admin/super.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

  <div class="super-layout">
    <aside class="super-sidebar">
      <div class="super-logo">
        <img src="/images/logo.png" alt="Logo" style="width: 36px; height: 36px; border-radius: 8px; object-fit: cover;">
        <span>Super Admin</span>
      </div>

      <nav class="super-nav">
        <a class="super-nav-link active" href="/super-admin">
          <i class="fa-solid fa-building"></i>
          <span>Restoranlar</span>
        </a>
        <a class="super-nav-link" href="/" target="_blank">
          <i class="fa-solid fa-globe"></i>
          <span>Asosiy Sayt</span>
        </a>
        <a class="super-nav-link" href="/admin" target="_blank">
          <i class="fa-solid fa-kitchen-set"></i>
          <span>Restoran Admini</span>
        </a>
      </nav>
    </aside>

    <main class="super-main">
      <header class="super-topbar">
        <h2 style="font-size: 20px; font-weight: 800;">Platforma Boshqaruvi</h2>
        <button class="btn-primary-super" onclick="openAddRestModal()">
          <i class="fa-solid fa-plus"></i> Yangi Restoran Qo'shish
        </button>
      </header>

      <div class="super-content">
        <!-- Statistika -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon rest"><i class="fa-solid fa-utensils"></i></div>
            <div>
              <div class="stat-value" id="statRestCount">0</div>
              <div class="stat-label">Jami Restoranlar</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon menu"><i class="fa-solid fa-bowl-food"></i></div>
            <div>
              <div class="stat-value" id="statMenuCount">0</div>
              <div class="stat-label">Jami Taomlar</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon orders"><i class="fa-solid fa-receipt"></i></div>
            <div>
              <div class="stat-value" id="statOrdersCount">0</div>
              <div class="stat-label">Jami Buyurtmalar</div>
            </div>
          </div>
        </div>

        <!-- Restoranlar jadvali -->
        <div class="card-table">
          <table class="super-table">
            <thead>
              <tr>
                <th>Logotip</th>
                <th>Restoran Nomi</th>
                <th>Slug (Havola)</th>
                <th>Telefon</th>
                <th>Stollar</th>
                <th>Taomlar</th>
                <th>Holat</th>
                <th style="text-align: right;">Amallar</th>
              </tr>
            </thead>
            <tbody id="superRestTableBody">
              <!-- JS orqali to'ldiriladi -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Yangi restoran qo'shish / tahrirlash modali -->
  <div class="modal-overlay" id="restModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 16px; padding: 26px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
        <h3 id="restModalTitle" style="font-size: 18px; font-weight: 800;">Yangi Restoran Ochish</h3>
        <button class="btn-icon" onclick="closeAddRestModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="addRestForm" onsubmit="saveRestaurant(event)">
        <input type="hidden" id="restEditId">
        
        <div class="form-group">
          <label class="form-label">Restoran Nomi *</label>
          <input type="text" id="restNameInput" class="form-control" placeholder="Masalan: Rayhon Milliy Taomlar" required oninput="autoGenerateSlug(this.value)">
        </div>

        <div class="form-group">
          <label class="form-label">Identifikator (Slug / Havola) *</label>
          <input type="text" id="restSlugInput" class="form-control" placeholder="masalan: rayhon" required>
          <small style="color: var(--gray-600); font-size: 11px;">Mijozlar ushbu manzil orqali kiradi: /r/slug</small>
        </div>

        <div class="form-group">
          <label class="form-label">Admin Paroli *</label>
          <input type="text" id="restPasswordInput" class="form-control" value="123" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">Telefon raqami</label>
            <input type="text" id="restPhoneInput" class="form-control" placeholder="+998 90 123-45-67">
          </div>
          <div class="form-group">
            <label class="form-label">Stollar soni</label>
            <input type="number" id="restTablesInput" class="form-control" value="15" min="1" max="100">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Manzil</label>
          <input type="text" id="restAddressInput" class="form-control" placeholder="Toshkent sh., Yunusobod tumani...">
        </div>

        <div class="form-group">
          <label class="form-label">Logotip URL yoki Rasm havolasi</label>
          <input type="url" id="restLogoInput" class="form-control" placeholder="https://...">
        </div>

        <div class="form-group">
          <label class="form-label">Banner (Fon rasmi) URL</label>
          <input type="url" id="restBannerInput" class="form-control" placeholder="https://...">
        </div>

        <div class="form-group">
          <label class="form-label">Qisqacha tavsifi</label>
          <textarea id="restDescInput" class="form-control" rows="2" placeholder="O'zbek va Yevropa taomlari..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Xizmat haqi (%)</label>
          <input type="number" id="restFeeInput" class="form-control" value="10" min="0" max="50">
        </div>

        <button type="submit" class="btn-primary-super" style="width: 100%; justify-content: center; padding: 13px;">
          <i class="fa-solid fa-check"></i> Restoranni saqlash
        </button>
      </form>
    </div>
  </div>

  <script src="/super-admin/super.js"></script>
</body>
</html>
