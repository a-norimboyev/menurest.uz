<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oshxona Ekrani (KDS) - Menurest</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#166534">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/kitchen/kitchen.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    .kds-main-columns {
      display: flex;
      gap: 16px;
      padding: 16px;
      overflow-x: auto;
      height: calc(100vh - 140px); /* Adjust based on header height */
    }
    .kds-column {
      flex: 1;
      min-width: 320px;
      background: var(--surface-color, #1e293b);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .kds-column-header {
      color: var(--text-color, #f8fafc);
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .kds-column-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      flex: 1;
    }
    
    /* Responsive tweaks for smaller screens */
    @media (max-width: 1024px) {
      .kds-main-columns {
        flex-direction: row;
      }
    }
    
    /* Order Cards */
    .order-card {
      background: var(--surface-color-light, #334155);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: var(--text-color, #f8fafc);
    }
    .order-card.status-danger { border-left: 6px solid var(--error-color, #ef4444); }
    .order-card.status-warning { border-left: 6px solid var(--warning-color, #f59e0b); }
    .order-card.status-ok { border-left: 6px solid var(--success-color, #10b981); }
    
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .table-number {
      font-size: 2rem;
      font-weight: 900;
      color: var(--primary-color, #3b82f6);
    }
    .elapsed-time {
      font-size: 1.25rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0,0,0,0.2);
    }
    .timer-danger { color: var(--error-color, #ef4444); }
    .timer-warning { color: var(--warning-color, #f59e0b); }
    .timer-ok { color: var(--success-color, #10b981); }
    
    .order-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .order-item {
      display: flex;
      gap: 12px;
      padding: 8px;
      background: rgba(0,0,0,0.15);
      border-radius: 4px;
      cursor: pointer;
    }
    .order-item.done {
      opacity: 0.5;
      text-decoration: line-through;
    }
    .item-qty {
      font-weight: bold;
      min-width: 24px;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }
    .btn-action {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .btn-action:hover { opacity: 0.9; }
    .btn-start { background: var(--primary-color, #3b82f6); color: white; }
    .btn-ready { background: var(--success-color, #10b981); color: white; }
    .ready-label {
      text-align: center;
      width: 100%;
      color: var(--success-color, #10b981);
      font-weight: bold;
      padding: 8px;
    }
    
    /* Tab controls for small screens */
    .kds-tabs {
      display: none;
      gap: 8px;
      padding: 16px;
      background: var(--surface-color, #1e293b);
    }
    .kds-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: var(--surface-color-light, #334155);
      color: var(--text-color, #f8fafc);
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .kds-tab.active {
      background: var(--primary-color, #3b82f6);
    }
    
    @media (max-width: 768px) {
      .kds-tabs { display: flex; }
      .kds-main-columns { padding-top: 0; }
      .kds-column { display: none; }
      .kds-column.active-col { display: flex; }
    }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-family: 'Inter', -apple-system, sans-serif;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.05), 0 2px 6px rgba(0,0,0,0.03);
      --shadow-lg: 0 12px 24px rgba(0,0,0,0.08);
      --border-color: #E2E8F0;
    }
    body {
      font-family: var(--font-family) !important;
      background-color: #F8FAFC !important;
      color: #0F172A !important;
    }
    /* Buttons */
    .btn, .btn-submit, .btn-primary, .qr-action-btn, button {
      font-family: 'Inter', sans-serif !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    .btn:hover, .btn-submit:hover, .btn-primary:hover, button:hover {
      transform: translateY(-1px);
    }
    .btn:active, .btn-submit:active, .btn-primary:active, button:active {
      transform: translateY(0);
    }
    /* Cards */
    .card, .order-card, .table-card, .auth-card {
      border: 1px solid var(--border-color) !important;
      box-shadow: var(--shadow-sm) !important;
      border-radius: var(--radius-md) !important;
      transition: all 0.25s ease !important;
      background: #FFFFFF !important;
    }
    .card:hover, .order-card:hover, .table-card:hover {
      box-shadow: var(--shadow-md) !important;
    }
    /* Inputs */
    input, select, textarea, .form-control, .form-input {
      font-family: 'Inter', sans-serif !important;
      border-radius: 10px !important;
      border: 1px solid #CBD5E1 !important;
      padding: 12px 16px !important;
      transition: all 0.2s !important;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02) inset !important;
    }
    input:focus, select:focus, textarea:focus, .form-control:focus, .form-input:focus {
      border-color: var(--primary-color) !important;
      box-shadow: 0 0 0 3px var(--primary-light) !important;
      outline: none !important;
    }
    /* Tables */
    .custom-table th {
      background: #F1F5F9 !important;
      color: #475569 !important;
      font-weight: 600 !important;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-size: 11px !important;
      border-bottom: 2px solid #E2E8F0 !important;
    }
    .custom-table td {
      border-bottom: 1px solid #F1F5F9 !important;
      color: #1E293B !important;
    }
    .custom-table tr:hover td {
      background: #F8FAFC !important;
    }
    /* Sidebar Links */
    .nav-link {
      border-radius: 10px !important;
      margin: 2px 6px !important;
      padding: 10px 14px !important;
    }
    .nav-link:hover {
      background: rgba(255, 255, 255, 0.06) !important;
      color: #FFFFFF !important;
    }
    .nav-link.active {
      background: var(--primary-color) !important;
      color: #FFFFFF !important;
      box-shadow: 0 4px 10px rgba(22, 101, 52, 0.3) !important;
    }
    
    /* Topbar */
    .admin-topbar {
      background: rgba(255, 255, 255, 0.8) !important;
      backdrop-filter: blur(12px) !important;
      border-bottom: 1px solid var(--border-color) !important;
    }
    
    /* Client Menu Tweaks */
    .bottom-cart-bar {
      background: rgba(255, 255, 255, 0.9) !important;
      backdrop-filter: blur(16px) !important;
      border-top: 1px solid rgba(0,0,0,0.05) !important;
    }
    .dish-card {
      border: 1px solid var(--border-color) !important;
      border-radius: var(--radius-md) !important;
      overflow: hidden !important;
      background: #FFFFFF !important;
    }
  </style>
  
</head>
<body class="bg-background text-text">

  <!-- KDS Topbar -->
  <header class="kds-topbar" style="background: var(--surface-color, #1e293b); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1);">
    <div class="kds-brand" style="display: flex; align-items: center; gap: 16px;">
      <img id="kdsLogo" src="/images/logo.png" alt="Logo" class="kds-logo" style="height: 48px; border-radius: 8px;">
      <div>
        <div class="kds-title" id="kdsRestName" style="font-size: 1.5rem; font-weight: bold; color: var(--text-color, #f8fafc);">Oshxona Ekrani (KDS)</div>
        <div class="kds-subtitle" style="color: var(--text-muted, #94a3b8);">Jonli Buyurtmalar Chiptalari</div>
      </div>
    </div>

    <div class="kds-stats" style="display: flex; gap: 24px; align-items: center;">
      <div class="stat-badge" style="font-size: 1.2rem; color: var(--text-color, #f8fafc);">
        <i class="fa-solid fa-fire-burner"></i>
        <span><span id="lblActiveTickets">Faol chiptalar</span>: <b id="activeTicketsCount">0</b></span>
      </div>
      <div class="clock-badge" id="kdsClock" style="font-size: 1.5rem; font-weight: bold; font-family: monospace; color: var(--text-color, #f8fafc);">00:00:00</div>
    </div>

    <div class="kds-actions" style="display: flex; gap: 12px; align-items: center;">
      <div class="kds-lang-switcher" style="display: flex; background: rgba(0,0,0,0.2); border-radius: 6px; overflow: hidden;">
        <button type="button" class="kds-lang-btn active" data-lang="uz" onclick="setKdsLanguage('uz')" style="padding: 8px 12px; border: none; background: transparent; color: white; cursor: pointer;">UZ</button>
        <button type="button" class="kds-lang-btn" data-lang="ru" onclick="setKdsLanguage('ru')" style="padding: 8px 12px; border: none; background: transparent; color: white; cursor: pointer;">RU</button>
        <button type="button" class="kds-lang-btn" data-lang="en" onclick="setKdsLanguage('en')" style="padding: 8px 12px; border: none; background: transparent; color: white; cursor: pointer;">EN</button>
      </div>
      <button class="kds-btn-icon" id="btnSoundToggle" onclick="toggleSound()" title="Ovozni yoqish/o'chirish" style="padding: 10px; border: none; border-radius: 6px; background: rgba(255,255,255,0.1); color: white; cursor: pointer;">
        <i class="fa-solid fa-volume-high"></i>
      </button>
      <button class="kds-btn-icon" onclick="toggleFullscreen()" title="To'liq ekran" style="padding: 10px; border: none; border-radius: 6px; background: rgba(255,255,255,0.1); color: white; cursor: pointer;">
        <i class="fa-solid fa-expand"></i>
      </button>
      <a href="/admin" class="kds-btn-exit" title="Boshqaruv paneliga qaytish" style="padding: 10px 16px; border-radius: 6px; background: var(--error-color, #ef4444); color: white; text-decoration: none; font-weight: bold;">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> Admin
      </a>
    </div>
  </header>

  <!-- Tabs for Mobile -->
  <div class="kds-tabs">
    <button class="kds-tab active" onclick="switchMobileTab('new')">
      <i class="fa-solid fa-clock"></i> <span id="lblFilterNew">Yangi</span> (<span id="countNewTab">0</span>)
    </button>
    <button class="kds-tab" onclick="switchMobileTab('preparing')">
      <i class="fa-solid fa-fire"></i> <span id="lblFilterPrep">Tayyorlanmoqda</span> (<span id="countPrepTab">0</span>)
    </button>
    <button class="kds-tab" onclick="switchMobileTab('ready')">
      <i class="fa-solid fa-check"></i> <span id="lblFilterReady">Tayyor</span> (<span id="countReadyTab">0</span>)
    </button>
  </div>

  <!-- 3-Column Layout -->
  <main class="kds-main-columns" id="ticketsContainer">
    <!-- Column: New -->
    <div class="kds-column active-col" id="col-new">
      <div class="kds-column-header">
        <span><i class="fa-solid fa-clock"></i> <span class="col-title-new">Yangi</span></span>
        <span class="badge" id="countNew">0</span>
      </div>
      <div class="kds-column-content" id="listNew"></div>
    </div>
    
    <!-- Column: Preparing -->
    <div class="kds-column" id="col-preparing">
      <div class="kds-column-header">
        <span><i class="fa-solid fa-fire"></i> <span class="col-title-prep">Tayyorlanmoqda</span></span>
        <span class="badge" id="countPrep">0</span>
      </div>
      <div class="kds-column-content" id="listPrep"></div>
    </div>
    
    <!-- Column: Ready -->
    <div class="kds-column" id="col-ready">
      <div class="kds-column-header">
        <span><i class="fa-solid fa-check"></i> <span class="col-title-ready">Tayyor</span></span>
        <span class="badge" id="countReady">0</span>
      </div>
      <div class="kds-column-content" id="listReady"></div>
    </div>
  </main>

  <script src="/kitchen/kitchen.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW error:', err));
      });
    }
    
    function switchMobileTab(tab) {
      document.querySelectorAll('.kds-tab').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');
      
      document.querySelectorAll('.kds-column').forEach(col => col.classList.remove('active-col'));
      document.getElementById('col-' + tab).classList.add('active-col');
    }
  </script>
</body>
</html>
