<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ofitsiant Paneli</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/waiter.css">
  

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-family: 'Inter', -apple-system, sans-serif;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.05), 0 2px 6px rgba(0,0,0,0.03);
      --shadow-lg: 0 12px 24px rgba(0,0,0,0.08);
      --border-color: #E2E8F0;
    }
    body {
      font-family: var(--font-family) !important;
      background-color: #F8FAFC !important;
      color: #0F172A !important;
    }
    /* Buttons */
    .btn, .btn-submit, .btn-primary, .qr-action-btn, button {
      font-family: 'Inter', sans-serif !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    .btn:hover, .btn-submit:hover, .btn-primary:hover, button:hover {
      transform: translateY(-1px);
    }
    .btn:active, .btn-submit:active, .btn-primary:active, button:active {
      transform: translateY(0);
    }
    /* Cards */
    .card, .order-card, .table-card, .auth-card {
      border: 1px solid var(--border-color) !important;
      box-shadow: var(--shadow-sm) !important;
      border-radius: var(--radius-md) !important;
      transition: all 0.25s ease !important;
      background: #FFFFFF !important;
    }
    .card:hover, .order-card:hover, .table-card:hover {
      box-shadow: var(--shadow-md) !important;
    }
    /* Inputs */
    input, select, textarea, .form-control, .form-input {
      font-family: 'Inter', sans-serif !important;
      border-radius: 10px !important;
      border: 1px solid #CBD5E1 !important;
      padding: 12px 16px !important;
      transition: all 0.2s !important;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02) inset !important;
    }
    input:focus, select:focus, textarea:focus, .form-control:focus, .form-input:focus {
      border-color: var(--primary-color) !important;
      box-shadow: 0 0 0 3px var(--primary-light) !important;
      outline: none !important;
    }
    /* Tables */
    .custom-table th {
      background: #F1F5F9 !important;
      color: #475569 !important;
      font-weight: 600 !important;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-size: 11px !important;
      border-bottom: 2px solid #E2E8F0 !important;
    }
    .custom-table td {
      border-bottom: 1px solid #F1F5F9 !important;
      color: #1E293B !important;
    }
    .custom-table tr:hover td {
      background: #F8FAFC !important;
    }
    /* Sidebar Links */
    .nav-link {
      border-radius: 10px !important;
      margin: 2px 6px !important;
      padding: 10px 14px !important;
    }
    .nav-link:hover {
      background: rgba(255, 255, 255, 0.06) !important;
      color: #FFFFFF !important;
    }
    .nav-link.active {
      background: var(--primary-color) !important;
      color: #FFFFFF !important;
      box-shadow: 0 4px 10px rgba(22, 101, 52, 0.3) !important;
    }
    
    /* Topbar */
    .admin-topbar {
      background: rgba(255, 255, 255, 0.8) !important;
      backdrop-filter: blur(12px) !important;
      border-bottom: 1px solid var(--border-color) !important;
    }
    
    /* Client Menu Tweaks */
    .bottom-cart-bar {
      background: rgba(255, 255, 255, 0.9) !important;
      backdrop-filter: blur(16px) !important;
      border-top: 1px solid rgba(0,0,0,0.05) !important;
    }
    .dish-card {
      border: 1px solid var(--border-color) !important;
      border-radius: var(--radius-md) !important;
      overflow: hidden !important;
      background: #FFFFFF !important;
    }
  </style>
  
</head>
<body>

  <div class="header">
    <h2><i class="fa-solid fa-bell-concierge"></i> Ofitsiant Paneli</h2>
    <div class="user-info">
      <i class="fa-solid fa-circle-user"></i>
      <span id="waiterName">Yuklanmoqda...</span>
    </div>
  </div>

  <div class="content-area">
    
    <!-- Mening Stollarim -->
    <div id="view-tables" class="view-section active">
      <h3 style="margin-bottom: 12px; font-size: 15px; color: var(--gray-400);">Mening Stollarim</h3>
      <div id="tablesContainer">
        <!-- JS to'ldiradi -->
      </div>
    </div>

    <!-- Chaqiruvlar -->
    <div id="view-calls" class="view-section">
      <h3 style="margin-bottom: 12px; font-size: 15px; color: var(--gray-400);">Yangi Chaqiruvlar</h3>
      <div id="callsContainer"></div>
    </div>

    <!-- Tayyor Taomlar -->
    <div id="view-ready" class="view-section">
      <h3 style="margin-bottom: 12px; font-size: 15px; color: var(--gray-400);">Yetkazish kerak</h3>
      <div id="readyContainer"></div>
    </div>

  </div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchView('tables', this)">
      <i class="fa-solid fa-border-all"></i>
      <span>Stollar</span>
    </div>
    <div class="nav-item" onclick="switchView('calls', this)">
      <i class="fa-solid fa-bell"></i>
      <span>Chaqiruv</span>
    </div>
    <div class="nav-item" onclick="switchView('ready', this)">
      <i class="fa-solid fa-utensils"></i>
      <span>Tayyor</span>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/waiter/waiter.js"></script>
</body>
</html>
